name: AI deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: safepath-ai-deploy
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
        env:
          AI_LOAD_MODELS: '0'
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment script
        run: bash -n scripts/deploy-ai.sh
      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AI_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Deploy using Systems Manager
        env:
          GH_TOKEN: ${{ github.token }}
          INSTANCE_ID: i-01f3c43ca8e7d0229
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$latest" = "$GITHUB_SHA" || { echo 'Not the latest main commit' >&2; exit 1; }
          encoded=$(base64 -w 0 scripts/deploy-ai.sh)
          command="set -eu; f=\$(mktemp /tmp/safepath-ai-deploy.XXXXXX); trap 'rm -f \"\$f\"' EXIT; printf %s '$encoded' | base64 -d > \"\$f\"; bash \"\$f\" '$GITHUB_SHA'"
          parameters=$(jq -nc --arg command "$command" '{commands:[$command],executionTimeout:["2400"]}')
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$parameters" --query Command.CommandId --output text)
          echo "SSM command: $id"
          for attempt in $(seq 1 480); do
            result=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --output json 2>/dev/null) || { sleep 5; continue; }
            status=$(jq -r .Status <<< "$result")
            case "$status" in
              Success) jq -r .StandardOutputContent <<< "$result"; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) jq -r '.StandardOutputContent,.StandardErrorContent' <<< "$result"; exit 1 ;;
            esac
            sleep 5
          done
          echo 'SSM polling timed out; inspect command status before retrying' >&2
          exit 1
